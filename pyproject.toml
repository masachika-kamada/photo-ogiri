[project]
name = "photo-ogiri"
version = "0.1.0"
description = "AI-judged multiplayer photo game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "azure-identity>=1.24",
    "azure-storage-blob>=12.26",
    "azure-storage-queue>=12.13",
    "fastapi>=0.116",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
photo-ogiri-api = "photo_ogiri.api:main"
photo-ogiri-worker = "photo_ogiri.worker:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]
ai = [
    "numpy>=2.0",
    "torch>=2.7",
    "transformers>=5.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["dev", "ai"]